name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: true
          cache: true
      - name: Run Webpack
        run: pnpm run build
      - name: Push to deploy branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p "$RUNNER_TEMP/temp-dist"
          cp -rT dist "$RUNNER_TEMP/temp-dist"
          git fetch origin deploy
          git checkout deploy
          rm -rf dist
          cp -rT "$RUNNER_TEMP/temp-dist" dist
          git add dist/*
          git commit -m "Update deployment from $GITHUB_SHA"
          git push origin deploy